name: "Release Genshin (CN) on tag"
on:
  push:
    tags:
      - '*'
env:
  YAAGL_VERSION: ${{ github.ref_name }}
permissions:
  contents: "write"
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check tag is semver
        # The in-app updater compares tags with semver gt().
        run: |
          [[ "$YAAGL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag '$YAAGL_VERSION' is not semver (e.g. 0.1.0)"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v3

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sophon Build Cache
        id: sophon-build-cache
        uses: actions/cache@v4
        with:
          key: cache-key-${{ hashFiles('build-sophon.sh', 'sophon_server/*.py', 'sophon_server/uv.lock', 'sophon_server/.python-version', 'sophon_server/pyproject.toml') }}
          path: |
            ./sophon_server/build/
            ./sophon_server/.cache/

      - name: Sophon Build
        if: ${{ steps.sophon-build-cache.outputs.cache-hit != 'true' }}
        run: |
          ./build-sophon.sh

      - name: Save Sophon Build Cache
        if: ${{ steps.sophon-build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: cache-key-${{ hashFiles('build-sophon.sh', 'sophon_server/*.py', 'sophon_server/uv.lock', 'sophon_server/.python-version', 'sophon_server/pyproject.toml') }}
          path: |
            ./sophon_server/build/
            ./sophon_server/.cache/

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          version: 7
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: |
          ./configure.sh
          YAAGL_CHANNEL_CLIENT=hk4ecn node ./build-app.js
          cp dist/Yaagl/resources.neu resources_hk4ecn.neu

      - name: Package
        run: |
          # The in-app updater pulls the sidecar from this tarball.
          tar -zcf Yaagl.app.tar.gz Yaagl.app
          mkdir dmg
          ditto Yaagl.app dmg/Yaagl.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Yaagl -srcfolder dmg -ov -format UDZO "Yaagl-$YAAGL_VERSION.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$YAAGL_VERSION" --title "Yaagl $YAAGL_VERSION" --generate-notes \
            "Yaagl-$YAAGL_VERSION.dmg" Yaagl.app.tar.gz resources_hk4ecn.neu
